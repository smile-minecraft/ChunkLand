name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: the build only reads the repo and never pushes.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 25, Gradle wrapper)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0 — https://github.com/actions/checkout/releases/tag/v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-java v6.0.0 — https://github.com/actions/setup-java/releases/tag/v6.0.0
      # v6 is the first release line that explicitly provisions Temurin JDK 25 on hosted runners.
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'

      # gradle/actions wrapper-validation v6.3.0 — https://github.com/gradle/actions/releases/tag/v6.3.0
      # Verifies gradle-wrapper.jar against Gradle's published checksum list; never uses a global Gradle.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      # AceLib is compileOnly/testImplementation and resolved only via flatDir at
      # $ACE_OUTPUT_DIR (see settings.gradle.kts). We fetch the pinned v1.3.0
      # release asset (AceLib-1.3.0.jar) from GitHub Releases before any Gradle
      # compile/test. The same pinned output is reused for build/test and both
      # reproducibility jar builds; no Maven fallback, no embedded jar, no source build.
      - name: Fetch AceLib 1.3.0 release asset
        env:
          ACE_OUTPUT_DIR: ${{ runner.temp }}/chunkland-acelib
        run: bash scripts/build-acelib.sh

      - name: Build and test with Gradle wrapper
        env:
          ACE_OUTPUT_DIR: ${{ runner.temp }}/chunkland-acelib
        run: ./gradlew clean build --no-daemon

      # Reproducibility gate: build the archives twice from a clean state and require
      # byte-identical jars (main + sources) so local and CI outputs stay consistent.
      - name: Verify reproducible jar builds
        env:
          ACE_OUTPUT_DIR: ${{ runner.temp }}/chunkland-acelib
        run: |
          set -euo pipefail
          ./gradlew clean jar sourcesJar --no-daemon
          mkdir -p /tmp/repro-a
          cp chunkland-api/build/libs/*.jar chunkland-plugin/build/libs/*.jar /tmp/repro-a/
          ./gradlew clean jar sourcesJar --no-daemon
          mkdir -p /tmp/repro-b
          cp chunkland-api/build/libs/*.jar chunkland-plugin/build/libs/*.jar /tmp/repro-b/
          # 雙向 manifest/hash 比較：同時反映 A/B 兩邊完整 archive 名稱與 SHA，
          # A-only 或 B-only archive 都會使 job 失敗（不再使用單向 ls|xargs loop）。
          # 使用 diff <(sha256sum ... | sort) 比較兩邊完整清單，避免空 glob 與噪音。
          # `sha256sum -- *.jar`（--）防止檔名以 dash 開頭被當成 option，符合 shellcheck SC2086/SC2035。
          diff -u <(cd /tmp/repro-a && sha256sum -- *.jar | sort) <(cd /tmp/repro-b && sha256sum -- *.jar | sort) || {
            echo "REPRODUCIBILITY FAIL: manifest/hash 差異（A-only 或 B-only archive，或內容不同）" >&2
            echo "A manifest:" >&2
            (cd /tmp/repro-a && sha256sum -- *.jar | sort) >&2 || true
            echo "B manifest:" >&2
            (cd /tmp/repro-b && sha256sum -- *.jar | sort) >&2 || true
            exit 1
          }
          echo "REPRODUCIBLE: A/B manifest 與 hash 完全一致（含 main + sources JAR）"

  # M5 效能門檻：三項 p99（5000/50000/100000 ns，見
  # scripts/check-performance-gate.sh）＋ SQL/Economy/World query
  # sentinel。wall-clock 比較只住在 script 裡（單元測試本身不斷言時間），
  # 所以這個 job 紅掉代表真實回歸或熱路徑違規，不是機器噪聲。
  performance-gate:
    name: Performance gate (p99 budgets + hot-path sentinels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Fetch AceLib 1.3.0 release asset
        env:
          ACE_OUTPUT_DIR: ${{ runner.temp }}/chunkland-acelib
        run: bash scripts/build-acelib.sh

      - name: Run performance gate (p99 budgets + sentinels)
        env:
          ACE_OUTPUT_DIR: ${{ runner.temp }}/chunkland-acelib
        run: bash scripts/check-performance-gate.sh
