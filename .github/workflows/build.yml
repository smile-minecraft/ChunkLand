name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: the build only reads the repo and never pushes.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 25, Gradle wrapper)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0 — https://github.com/actions/checkout/releases/tag/v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-java v6.0.0 — https://github.com/actions/setup-java/releases/tag/v6.0.0
      # v6 is the first release line that explicitly provisions Temurin JDK 25 on hosted runners.
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'

      # gradle/actions wrapper-validation v6.3.0 — https://github.com/gradle/actions/releases/tag/v6.3.0
      # Verifies gradle-wrapper.jar against Gradle's published checksum list; never uses a global Gradle.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Build and test with Gradle wrapper
        run: ./gradlew clean build --no-daemon

      # Reproducibility gate: build the archives twice from a clean state and require
      # byte-identical jars (main + sources) so local and CI outputs stay consistent.
      - name: Verify reproducible jar builds
        run: |
          set -euo pipefail
          ./gradlew clean jar --no-daemon
          mkdir -p /tmp/repro-a
          cp chunkland-api/build/libs/*.jar chunkland-plugin/build/libs/*.jar /tmp/repro-a/
          ./gradlew clean jar --no-daemon
          mkdir -p /tmp/repro-b
          cp chunkland-api/build/libs/*.jar chunkland-plugin/build/libs/*.jar /tmp/repro-b/
          diff <(cd /tmp/repro-a && sha256sum *.jar | sort) <(cd /tmp/repro-b && sha256sum *.jar | sort) \
            && echo "REPRODUCIBLE: jar contents identical across builds"
