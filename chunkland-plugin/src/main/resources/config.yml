# ChunkLand configuration.
#
# This file provides the validated configuration sections currently supported by
# the plugin. Each feature owns its own typed section rather than using one
# consolidated block:
#   limits            -> typed land quotas
#   messages          -> message settings
#   selection         -> selection sessions and particle budgets
#   worlds.<name>     -> per-world claim-enabled + vertical-mode
#   subject-defaults  -> world/global SUBJECT_PERMISSION defaults (optional)
#   rule-defaults     -> world/global LAND_RULE defaults (optional)
#     vertical-mode accepts PER_CHUNK_DEPTH (default) or FULL_HEIGHT.
#     The mode only changes effective depth reads; stored depths are never
#     migrated or rewritten on a mode switch.
# Until a section is added, its top-level key is rejected on load so a typo or
# a premature copy-paste is a loud failure rather than a silently ignored line.
#
# Reload uses ChunkLand's own reload API (Bukkit /reload is NOT supported).
# A successful reload bumps `globalPolicyEpoch` and every known
# `worldPolicyEpoch` by 1. Global policy content changes also invalidate all
# active selection sessions; world-only changes affect only matching worlds.

messages:
  default-locale: en_US
  cooldown-seconds: 2

limits:
  max-lands-per-player: 5
  max-total-chunks-per-player: 256
  max-chunks-per-land: 128
  max-sublands-per-land: 16
  max-selection-side-length: 32
  max-selection-chunks: 1024

selection:
  session-timeout-seconds: 600
  # Selection boundary particle visualization (player-scoped, no terrain queries).
  # max-segments: boundary edges kept per frame (1-4096, sorted, prefix kept).
  # max-particles-per-tick: particles sent per render tick (1-1024, window rotates).
  # render-distance-blocks: segments culled beyond this viewer distance (8-128).
  # refresh-interval-ticks: ticks between renders (1-200).
  visualization-max-segments: 256
  visualization-max-particles-per-tick: 128
  visualization-render-distance-blocks: 48
  visualization-refresh-interval-ticks: 10

worlds:
  # Worlds not listed here follow the `claim-enabled: true` and
  # `vertical-mode: PER_CHUNK_DEPTH` defaults.
  world:
    claim-enabled: true
    vertical-mode: PER_CHUNK_DEPTH
  world_nether:
    claim-enabled: false
  world_the_end:
    claim-enabled: false

# Permission world/global defaults (Direct Trust foundation).
#
# `subject-defaults` answers "may this actor act?" per SUBJECT_PERMISSION
# action; `rule-defaults` answers "can this mechanic happen here?" per
# LAND_RULE. The two namespaces are separate typed maps and never fall back
# to each other. World entries use world names and resolve to world UUIDs
# once at load; unknown worlds warn and are ignored. A missing section, a
# missing entry, or an explicit INHERIT all mean "fall through to the next
# resolver layer", ending at implicit DENY. Action/rule keys are
# case-insensitive; world names are case-sensitive. Land bindings, land
# defaults and SubLand layers are NOT configured here (no durable source is
# wired yet) and stay INHERIT.
#
#subject-defaults:
#  global:
#    BLOCK_BREAK: DENY
#  worlds:
#    world:
#      BLOCK_BREAK: ALLOW
#rule-defaults:
#  global:
#    PVP: DENY
#  worlds:
#    world:
#      PVP: ALLOW
