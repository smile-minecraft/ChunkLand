# ChunkLand configuration.
#
# This file provides the validated configuration sections currently supported by
# the plugin. Each feature owns its own typed section rather than using one
# consolidated block:
#   limits            -> typed land quotas
#   messages          -> message settings
#   audit             -> audit history retention
#   selection         -> selection sessions and particle budgets
#   feedback          -> deny particles and push-out tuning
#   economy           -> claim currency + owner-total price-per-chunk tiers
#   worlds.<name>     -> per-world claim-enabled + vertical-mode
#   subject-defaults  -> world/global SUBJECT_PERMISSION defaults (optional)
#   rule-defaults     -> world/global LAND_RULE defaults (optional)
#     vertical-mode accepts PER_CHUNK_DEPTH (default) or FULL_HEIGHT.
#     The mode only changes effective depth reads; stored depths are never
#     migrated or rewritten on a mode switch.
# Until a section is added, its top-level key is rejected on load so a typo or
# a premature copy-paste is a loud failure rather than a silently ignored line.
#
# Reload uses ChunkLand's own reload API (Bukkit /reload is NOT supported).
# A successful reload bumps `globalPolicyEpoch` and every known
# `worldPolicyEpoch` by 1. Global policy content changes also invalidate all
# active selection sessions; world-only changes affect only matching worlds.

messages:
  default-locale: en_US
  cooldown-seconds: 2

# Audit history (operator-tunable, reloadable).
#
# `retention-days` bounds how long audit history is kept (default 180).
# `0` means retain forever and no purge runs. Purge deletes only audit rows
# strictly older than the cutoff in batches on the persistence thread;
# land, chunk and ledger rows are never touched, and deleted-land history
# stays readable until its own cutoff expires.
audit:
  retention-days: 180

# Claim economy (operator-tunable, reloadable).
#
# `currency` names the money every price is stored and charged in; `scale`
# is the minor-units-per-unit exponent (2 means 100 minor = 1 major).
# `pricing.tiers` prices each chunk by the owner's global total chunk count
# (all Player Lands, never Server Land): chunk index (previousUntil, until]
# costs `price-per-chunk` major units. The table must stay a contiguous
# partition ending in `unbounded`; any gap, overlap, negative, non-finite,
# or overflowing entry fails the load and keeps the previous snapshot, so
# player claims fail closed instead of silently repricing. Refunds always
# come from the durable per-chunk cost basis, never from these tiers, so
# editing tiers never changes a past payment's refund. Never change the
# currency scale while the ledger holds live rows: stored minor units would
# reconvert to different major amounts.
economy:
  currency:
    code: EMC
    scale: 2
  pricing:
    tiers:
      - until: 20
        price-per-chunk: 1.00
      - until: 50
        price-per-chunk: 2.00
      - until: 100
        price-per-chunk: 4.00
      - until: unbounded
        price-per-chunk: 8.00

limits:
  max-lands-per-player: 5
  max-total-chunks-per-player: 256
  max-chunks-per-land: 128
  max-sublands-per-land: 16
  max-selection-side-length: 32
  max-selection-chunks: 1024
  # Protection decision-cache budget (memory-only, per enable generation).
  # Same-epoch decisions reuse one verdict; any epoch move misses naturally.
  # Zero disables reuse (every decision recomputes, fail-closed as before).
  max-decision-cache-entries: 4096

selection:
  session-timeout-seconds: 600
  # Selection boundary particle visualization (player-scoped, no terrain queries).
  # max-segments: boundary edges kept per frame (1-4096, sorted, prefix kept).
  # max-particles-per-tick: particles sent per render tick (1-1024, window rotates).
  # render-distance-blocks: segments culled beyond this viewer distance (8-128).
  # refresh-interval-ticks: ticks between renders (1-200).
  visualization-max-segments: 256
  visualization-max-particles-per-tick: 512
  visualization-render-distance-blocks: 64
  visualization-refresh-interval-ticks: 10

# Deny feedback (operator-tunable, reloadable). Everything here is shown to
# the denied player only and never changes what is allowed.
#
# entry-wall-*: the red border drawn when a player is refused entry.
#   enabled: draw it at all.
#   radius-blocks: how far around the player the border is traced (2-16).
#   particle-size-percent: dust size, 100 = vanilla size (25-400).
#   points-per-block: particles per block along the border (1-4).
#   cooldown-millis: quiet time between two walls for one player (100-60000).
# action-mark-*: the outline on a block (or rings on an entity) the land
#   refused to let the player break, place or use.
# push-out-*: how a refused player is moved back.
#   distance-blocks: blocks between the border and the landing (1-8).
#   cooldown-millis: quiet time between two push-outs for one player
#     (100-60000). Keep it at or below the time a player needs to walk the
#     distance back (about 500 ms for 3 blocks), otherwise the player is
#     held on cancelled moves and the screen stutters.
feedback:
  entry-wall-enabled: true
  entry-wall-radius-blocks: 6
  entry-wall-particle-size-percent: 160
  entry-wall-points-per-block: 2
  entry-wall-cooldown-millis: 2000
  action-mark-enabled: true
  action-mark-particle-size-percent: 110
  action-mark-cooldown-millis: 400
  push-out-distance-blocks: 3
  push-out-cooldown-millis: 500

worlds:
  # Worlds not listed here follow the `claim-enabled: true` and
  # `vertical-mode: PER_CHUNK_DEPTH` defaults.
  world:
    claim-enabled: true
    vertical-mode: PER_CHUNK_DEPTH
  world_nether:
    claim-enabled: false
  world_the_end:
    claim-enabled: false

# 權限的世界／全域預設（Direct Trust 基礎）。
#
# 對齊企劃 §28：ENTRY 預設為 ALLOW，讓未受 ban 的陌生人可進入已載入領地。
# ban 仍在 landBindings 層以 DENY 優先；landAuth 未載入或不可驗證時維持 fail-closed。
subject-defaults:
  global:
    ENTRY: ALLOW

# `subject-defaults` answers "may this actor act?" per SUBJECT_PERMISSION
# action; `rule-defaults` answers "can this mechanic happen here?" per
# LAND_RULE. The two namespaces are separate typed maps and never fall back
# to each other. World entries use world names and resolve to world UUIDs
# once at load; unknown worlds warn and are ignored. A missing section, a
# missing entry, or an explicit INHERIT all mean "fall through to the next
# resolver layer", ending at implicit DENY. Action/rule keys are
# case-insensitive; world names are case-sensitive. Land bindings, land
# defaults and SubLand layers are NOT configured here (no durable source is
# wired yet) and stay INHERIT.
#
#rule-defaults:
#  global:
#    PVP: DENY
#  worlds:
#    world:
#      PVP: ALLOW
