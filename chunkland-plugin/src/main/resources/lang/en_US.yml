m0:
  message:
    smoke: "<hover:show_text:'<green>hover: value=<value></green>'><click:run_command:'/chunkland m0message'>Java click: <value></click></hover>"
message:
  bedrock:
    fallback:
      run_command: 'Run command: <payload>'
      suggest_command: 'Suggest command: <payload>'
      open_url: 'Open URL: <payload>'
      copy_to_clipboard: 'Copy to clipboard: <payload>'
      unknown: 'Action: <payload>'
command:
  land:
    help: |-
      <gray>Usage: /land <subcommand> [args]</gray>
      <yellow>Land actions</yellow>
      <gray>  <hover:show_text:'<gray>Show the command overview.</gray>'><click:suggest_command:'/land help'>help      </click></hover><hover:show_text:'<gray>Receive the selection wand.</gray>'><click:suggest_command:'/land wand'>wand     </click></hover><hover:show_text:'<gray>Claim the selected chunks.</gray>'><click:suggest_command:'/land claim'>claim    </click></hover><hover:show_text:'<gray>Confirm a pending claim.</gray>'><click:suggest_command:'/land confirm'>confirm</click></hover></gray>
      <gray>  <hover:show_text:'<gray>Expand this land.</gray>'><click:suggest_command:'/land expand'>expand    </click></hover><hover:show_text:'<gray>Shrink this land.</gray>'><click:suggest_command:'/land shrink'>shrink   </click></hover><hover:show_text:'<gray>Unclaim selected chunks.</gray>'><click:suggest_command:'/land unclaim'>unclaim  </click></hover><hover:show_text:'<gray>Rename this land.</gray>'><click:suggest_command:'/land rename'>rename</click></hover> </gray>
      <gray>  <hover:show_text:'<gray>Delete this land.</gray>'><click:suggest_command:'/land delete'>delete    </click></hover><hover:show_text:'<gray>Manage sublands.</gray>'><click:suggest_command:'/land subland'>subland  </click></hover>                </gray>
      <yellow>Permissions</yellow>
      <gray>  <hover:show_text:'<gray>Trust a player on this land.</gray>'><click:suggest_command:'/land trust'>trust     </click></hover><hover:show_text:'<gray>Remove a trusted player.</gray>'><click:suggest_command:'/land untrust'>untrust  </click></hover><hover:show_text:'<gray>Change a land default permission.</gray>'><click:suggest_command:'/land default'>default  </click></hover><hover:show_text:'<gray>Bind players or groups to profiles.</gray>'><click:suggest_command:'/land binding'>binding</click></hover></gray>
      <gray>  <hover:show_text:'<gray>Ban a player from this land.</gray>'><click:suggest_command:'/land ban'>ban       </click></hover><hover:show_text:'<gray>Unban a player.</gray>'><click:suggest_command:'/land unban'>unban    </click></hover><hover:show_text:'<gray>Manage subject groups.</gray>'><click:suggest_command:'/land group'>group    </click></hover><hover:show_text:'<gray>Open the management GUI.</gray>'><click:suggest_command:'/land manage'>manage</click></hover> </gray>
      <yellow>Queries</yellow>
      <gray>  <hover:show_text:'<gray>Manage permission profiles.</gray>'><click:suggest_command:'/land profile'>profile   </click></hover><hover:show_text:'<gray>Explain one permission outcome.</gray>'><click:suggest_command:'/land explain'>explain  </click></hover><hover:show_text:'<gray>Inspect this land.</gray>'><click:suggest_command:'/land inspect'>inspect  </click></hover><hover:show_text:'<gray>Search the audit log.</gray>'><click:suggest_command:'/land log'>log</click></hover>    </gray>
      <gray>  <hover:show_text:'<gray>Show nearby block history.</gray>'><click:suggest_command:'/land history'>history   </click></hover>                         </gray>
      <yellow>Administration</yellow>
      <gray>  <hover:show_text:'<gray>Toggle admin bypass.</gray>'><click:suggest_command:'/land bypass'>bypass    </click></hover><hover:show_text:'<gray>Administration tools.</gray>'><click:suggest_command:'/land admin'>admin    </click></hover>                </gray>
    usage: "<yellow>Usage: /land <subcommand> [args]</yellow>"
    unknown: "<red>Unknown subcommand <subcommand>. Use /land help.</red>"
    denied: "<red>You are not allowed to use this command.</red> <dark_gray>(requires <permission>)</dark_gray>"
    not_yet: "<yellow>Subcommand <subcommand> is not yet implemented.</yellow>"
    wand:
      given: "<green>Wand given.</green>"
      already_have: "<yellow>You already have the selection wand.</yellow>"
      inventory_full: "<red>Inventory full — cannot give wand. Clear space and try again.</red>"
      console: "<red>Only players can receive the wand.</red>"
      error: "<red>Could not create wand. Please try again later.</red>"
    confirm:
      console: "<red>Only players can confirm a claim.</red>"
      usage: "<yellow>Usage: /land confirm <generation> <revision> <land_name></yellow>"
      no_selection: "<yellow>No active selection. Select chunks first, then confirm again.</yellow>"
      stale: "<yellow>That confirmation has expired. Please review the latest details and confirm again.</yellow>"
    trust:
      console: "<red>Only players can trust members.</red>"
      usage: "<yellow>Usage: /land trust <player></yellow>"
      success: "<green>Trusted <player> on this land.</green>"
      failed: "<red>Trust failed: <reason>.</red>"
    untrust:
      console: "<red>Only players can untrust members.</red>"
      usage: "<yellow>Usage: /land untrust <player></yellow>"
      success: "<green>Removed <player> from this land.</green>"
      failed: "<red>Untrust failed: <reason>.</red>"
    default:
      console: "<red>Only players can change land defaults.</red>"
      usage: "<yellow>Usage: /land default <action> [ALLOW|DENY|INHERIT]</yellow>"
      success: "<green>The land default for “<action>” is now “<state>”.</green>"
      failed: "<red>Land default change failed: <reason>.</red>"
    ban:
      console: "<red>Only players can ban members.</red>"
      usage: "<yellow>Usage: /land ban <player></yellow>"
      success: "<green>Banned <player> from this land.</green>"
      failed: "<red>Ban failed: <reason>.</red>"
    unban:
      console: "<red>Only players can unban members.</red>"
      usage: "<yellow>Usage: /land unban <player></yellow>"
      success: "<green>Unbanned <player> on this land.</green>"
      failed: "<red>Unban failed: <reason>.</red>"
    claim:
      console: "<red>Only players can claim land.</red>"
      no_selection: "<yellow>No active selection. Select chunks first, then run /land claim with a name.</yellow>"
      success: "<green>Land <land_name> claimed: <chunk_count> chunks.</green>"
      rejected: "<red>Claim rejected: <reason>.</red>"
      failed: "<red>Claim failed: <reason>.</red>"
      cancelled: "<yellow>Claim confirmation cancelled — nothing was claimed.</yellow>"
    subland:
      console: "<red>Only players can manage sublands.</red>"
      usage: "<yellow>Usage: /land subland (select|create|update|delete|extend) [generation revision] [name]</yellow>"
      no_selection: "<yellow>No usable SubLand selection. Run /land subland select first, then select chunks.</yellow>"
      selected: "<green>SubLand work session selected for <land_name>: <generation>/<revision>. Use the wand to set its range.</green>"
      preview: "<yellow>Preview <action>: <generation>/<revision>, <land_name>. Next: <value></yellow>"
      extended: "<green>Protection depth extended for <count> chunks. Run the create or update confirmation again.</green>"
      created: "<green>Subland created.</green>"
      updated: "<green>Subland updated.</green>"
      deleted: "<green>Subland deleted.</green>"
      stale: "<yellow>That subland confirmation has expired. Please review the latest details and try again.</yellow>"
      confirm_depth: "<yellow>That subland reaches below the parent protection floor and needs an explicit depth confirmation: <reason>. Run <value> to continue.</yellow>"
      failed: "<red>Subland operation failed: <reason>.</red>"
      degraded: "<yellow>Subland saved but the live map is still rebuilding. Please wait a moment and try again: <reason>.</yellow>"
    rename:
      console: "<red>Only players can rename land.</red>"
      usage: "<yellow>Usage: /land rename <new_name></yellow>"
      success: "<green>Land renamed to <new_name> (was <old_name>).</green>"
      rejected: "<red>Rename rejected: <reason>.</red>"
      failed: "<red>Rename failed: <reason>.</red>"
      degraded: "<yellow>Land renamed to <new_name> but the live map is still rebuilding: <reason>.</yellow>"
    expand:
      console: "<red>Only players can expand land.</red>"
      no_selection: "<yellow>No active selection. Select chunks first, then run /land expand again.</yellow>"
      no_target: "<yellow>Stand on the land you want to expand and target it first.</yellow>"
      success: "<green>Expanded <chunk_count> chunks.</green>"
      rejected: "<red>Expand rejected: <reason>.</red>"
      failed: "<red>Expand failed: <reason>.</red>"
    shrink:
      console: "<red>Only players can shrink land.</red>"
      no_selection: "<yellow>No active selection. Select chunks first, then run /land shrink again.</yellow>"
      no_target: "<yellow>Stand on the land you want to shrink and target it first.</yellow>"
      success: "<green>Shrunk <chunk_count> chunks. Refunded <refund>.</green>"
      compensation_pending: "<yellow>Shrunk <chunk_count> chunks. The refund of <refund> is still being processed.</yellow>"
      delete_required: "<yellow>That would remove the whole land. Use /land delete to remove it entirely.</yellow>"
      rejected: "<red>Shrink rejected: <reason>.</red>"
      failed: "<red>Shrink failed: <reason>.</red>"
    delete:
      console: "<red>Only players can delete land.</red>"
      no_target: "<yellow>Stand on the land you want to delete and target it first.</yellow>"
      usage: "<yellow>Usage: /land delete confirm <revision></yellow>"
      confirm: "<yellow>This will permanently delete the land and refund its full cost. Run /land delete confirm <revision> to proceed.</yellow> <hover:show_text:'<gray>Click to fill the confirm command into the chat box</gray>'><click:suggest_command:'/land delete confirm <revision>'><green>[Fill command]</green></click></hover>"
      stale: "<yellow>That delete confirmation has expired. Please review the latest details and try again.</yellow>"
      success: "<green>Land <land_name> deleted: <chunk_count> chunks. Refunded <refund>.</green>"
      compensation_pending: "<yellow>Land deleted: <chunk_count> chunks. The refund of <refund> is still being processed.</yellow>"
      degraded: "<yellow>Land deleted but the live map is still rebuilding. Please wait a moment and try again: <reason>.</yellow>"
      rejected: "<red>Delete rejected: <reason>.</red>"
      failed: "<red>Delete failed: <reason>.</red>"
    group:
      console: "<red>Only players can manage groups.</red>"
      usage: "<yellow>Usage: /land group (create|list|add|remove|delete) [args]</yellow>"
      created: "<green>Group <group> created.</green>"
      listed: "<green>Groups: <groups>.</green>"
      listed_empty: "<gray>No groups yet.</gray>"
      added: "<green>Added <player> to group <group>.</green>"
      removed: "<green>Removed <player> from group <group>.</green>"
      deleted: "<green>Group <group> deleted.</green>"
      force_deleted: "<green>Group <group> force deleted: <affected>.</green>"
      failed: "<red>Group operation failed: <reason>.</red>"
    profile:
      console: "<red>Only players can manage profiles.</red>"
      usage: "<yellow>Usage: /land profile (create|list|set|delete) [args]</yellow>"
      created: "<green>Profile <profile> created.</green>"
      listed: "<green>Profiles: <profiles>.</green>"
      listed_empty: "<gray>No profiles yet.</gray>"
      set: "<green>Profile <profile>: “<action>” is now “<state>”.</green>"
      deleted: "<green>Profile <profile> deleted.</green>"
      force_deleted: "<green>Profile <profile> force deleted: <affected>.</green>"
      failed: "<red>Profile operation failed: <reason>.</red>"
    binding:
      console: "<red>Only players can manage bindings.</red>"
      usage: "<yellow>Usage: /land binding (bind|unbind) player <player> <profile> | group <group> <profile> [--in-subland]</yellow>"
      created: "<green>Binding created.</green>"
      updated: "<green>Binding updated.</green>"
      deleted: "<green>Binding removed.</green>"
      failed: "<red>Binding operation failed: <reason>.</red>"
    explain:
      console: "<red>Only players can explain permissions.</red>"
      usage: "<yellow>Usage: /land explain <action></yellow>"
      result: |-
        <gold>━━ Permission check: <action> ━━</gold>
        <gray>Result: </gray><white><outcome></white><gray>  Decided by: </gray><white><layer></white><gray> (<source>)</gray>
        <gray>You own this land: </gray><white><isOwner></white><gray>  Admin bypass: </gray><white><adminBypass></white><gray>  Steward: </gray><white><steward></white>
        <dark_gray>Trace: <reason> | Covering subland: <coveringSubLandId></dark_gray>
      denied: "<red>Cannot explain that permission: stand inside a land you manage and check the permission name.</red>"
      failed: "<red>Explain failed: <reason>.</red>"
    inspect:
      usage: "<yellow>Usage: /land inspect [player]</yellow>"
      result: |-
        <gold>━━ Land “<landName>” ━━</gold>
        <gray>Owner: </gray><white><owner></white><gray>  You own this land: </gray><white><isOwner></white>
        <gray>Size: </gray><white><chunks> chunks</white><gray> (limit <limitMaxChunksPerLand>, from <limitMaxChunksPerLandSource>)</gray>
        <gray>Sublands: </gray><white><sublands></white><gray> (limit <limitMaxSublandsPerLand>, from <limitMaxSublandsPerLandSource>)</gray>
        <gray>Server land: </gray><white><serverLand></white><gray>  Steward: </gray><white><steward></white>
        <hover:show_text:'<gray>Open the management menu and change permissions by clicking.</gray>'><click:run_command:'/land manage'><green>[Manage]</green></click></hover> <hover:show_text:'<gray>Fill in the trust command.</gray>'><click:suggest_command:'/land trust '><aqua>[Trust a player]</aqua></click></hover> <hover:show_text:'<gray>Fill in the ban command.</gray>'><click:suggest_command:'/land ban '><red>[Ban a player]</red></click></hover> <hover:show_text:'<gray>Fill in the rename command.</gray>'><click:suggest_command:'/land rename '><yellow>[Rename]</yellow></click></hover>
        <dark_gray>Land id <landId> | World <worldId> | Revision <structureRevision>/<landPolicyRevision> | Subject <playerUuid></dark_gray>
      denied: "<red>Cannot inspect a land here: stand inside a land you manage and try again.</red>"
    log:
      usage: "<yellow>Usage: /land log [u:player-uuid] [t:7d] [a:action] [land:land-uuid] [world:world-uuid] [limit:n] [page:n]</yellow>"
      empty: "<gray>No audit entries match those filters.</gray>"
      line: "<gray><value></gray>"
      failed: "<red>Audit log lookup failed: <reason>.</red>"
    history:
      usage: "<yellow>Usage: /land history</yellow>"
      empty: "<gray>No block history around your position.</gray>"
      line: "<gray><value></gray>"
      unavailable: "<red>Block history unavailable.</red>"
    manage:
      console: "<red>Only players can open the management GUI.</red>"
      denied: "<red>Cannot open the management menu: stand inside a land you manage and try again.</red>"
      bedrock:
        unsupported: "<yellow>That step is not available as a Bedrock form yet. Use /land <subcommand> in chat instead.</yellow>"
    bypass:
      console: "<red>Only players can toggle admin bypass.</red>"
      usage: "<yellow>Usage: /land bypass [on|off]</yellow>"
      "on": "<green>Admin bypass enabled.</green>"
      "off": "<gray>Admin bypass disabled.</gray>"
      failed: "<red>Admin bypass toggle failed: <reason>.</red>"
    help_detail:
      prompt: "<gray>Tip: run /land help followed by a subcommand name for details.</gray>"
      unknown_hint: "<red>Unknown subcommand <subcommand>. Run /land help to list every subcommand.</red>"
      permission: "<gray>Permission: <permission></gray>"
      help:
        short: "<gray>Show the command overview.</gray>"
        detail: "<gray>Groups every /land subcommand by purpose: land actions, permissions, queries and administration.</gray>"
        usage: "<yellow>Usage: /land help</yellow>"
      confirm:
        short: "<gray>Confirm a pending claim.</gray>"
        detail: "<gray>Confirms the selected claim with its generation, revision and land name.</gray>"
        usage: "<yellow>Usage: /land confirm <generation> <revision> <land_name></yellow>"
      wand:
        short: "<gray>Receive the selection wand.</gray>"
        detail: "<gray>Gives you the selection wand used to mark claim corners.</gray>"
        usage: "<yellow>Usage: /land wand</yellow>"
      claim:
        short: "<gray>Claim the selected chunks.</gray>"
        detail: "<gray>Creates a land from the current wand selection under the given name.</gray>"
        usage: "<yellow>Usage: /land claim <land_name></yellow>"
      trust:
        short: "<gray>Trust a player on this land.</gray>"
        detail: "<gray>Grants the named player the trusted-member access of this land.</gray>"
        usage: "<yellow>Usage: /land trust <player></yellow>"
      untrust:
        short: "<gray>Remove a trusted player.</gray>"
        detail: "<gray>Revokes the named player's trusted-member access on this land.</gray>"
        usage: "<yellow>Usage: /land untrust <player></yellow>"
      default:
        short: "<gray>Change a land default permission.</gray>"
        detail: "<gray>Sets the land-wide default outcome for one protection action.</gray>"
        usage: "<yellow>Usage: /land default <action> [ALLOW|DENY|INHERIT]</yellow>"
      binding:
        short: "<gray>Bind players or groups to profiles.</gray>"
        detail: "<gray>Creates, updates or removes generic permission bindings on this land.</gray>"
        usage: "<yellow>Usage: /land binding (bind|unbind) player <player> <profile> | group <group> <profile> [--in-subland]</yellow>"
      ban:
        short: "<gray>Ban a player from this land.</gray>"
        detail: "<gray>Denies the named player entry and access to this land.</gray>"
        usage: "<yellow>Usage: /land ban <player></yellow>"
      unban:
        short: "<gray>Unban a player.</gray>"
        detail: "<gray>Restores the named player's access to this land.</gray>"
        usage: "<yellow>Usage: /land unban <player></yellow>"
      subland:
        short: "<gray>Manage sublands.</gray>"
        detail: "<gray>Selects, creates, updates, deletes or extends a subland of this land.</gray>"
        usage: "<yellow>Usage: /land subland (select|create|update|delete|extend) [generation revision] [name]</yellow>"
      expand:
        short: "<gray>Expand this land.</gray>"
        detail: "<gray>Adds the selected chunks to the land you stand on.</gray>"
        usage: "<yellow>Usage: /land expand</yellow>"
      shrink:
        short: "<gray>Shrink this land.</gray>"
        detail: "<gray>Removes the selected chunks from this land with a refund.</gray>"
        usage: "<yellow>Usage: /land shrink</yellow>"
      unclaim:
        short: "<gray>Unclaim selected chunks.</gray>"
        detail: "<gray>Releases the selected chunks from this land (same flow as shrink).</gray>"
        usage: "<yellow>Usage: /land unclaim</yellow>"
      rename:
        short: "<gray>Rename this land.</gray>"
        detail: "<gray>Changes the display name of the land you stand on.</gray>"
        usage: "<yellow>Usage: /land rename <new_name></yellow>"
      delete:
        short: "<gray>Delete this land.</gray>"
        detail: "<gray>Permanently deletes the land with a full refund after confirmation.</gray>"
        usage: "<yellow>Usage: /land delete confirm <revision></yellow>"
      group:
        short: "<gray>Manage subject groups.</gray>"
        detail: "<gray>Creates, lists and edits the player groups used by bindings.</gray>"
        usage: "<yellow>Usage: /land group (create|list|add|remove|delete) [args]</yellow>"
      profile:
        short: "<gray>Manage permission profiles.</gray>"
        detail: "<gray>Creates, lists and edits reusable permission profiles.</gray>"
        usage: "<yellow>Usage: /land profile (create|list|set|delete) [args]</yellow>"
      explain:
        short: "<gray>Explain one permission outcome.</gray>"
        detail: "<gray>Shows why one protection action is allowed or denied here.</gray>"
        usage: "<yellow>Usage: /land explain <action></yellow>"
      inspect:
        short: "<gray>Inspect this land.</gray>"
        detail: "<gray>Shows owner, chunks, revisions and limits of the current land.</gray>"
        usage: "<yellow>Usage: /land inspect [player]</yellow>"
      log:
        short: "<gray>Search the audit log.</gray>"
        detail: "<gray>Searches durable audit entries with filters and paging.</gray>"
        usage: "<yellow>Usage: /land log [u:player-uuid] [t:7d] [a:action] [land:land-uuid] [world:world-uuid] [limit:n] [page:n]</yellow>"
      history:
        short: "<gray>Show nearby block history.</gray>"
        detail: "<gray>Shows recent block changes around your position.</gray>"
        usage: "<yellow>Usage: /land history</yellow>"
      manage:
        short: "<gray>Open the management GUI.</gray>"
        detail: "<gray>Opens the two-layer GUI showing permission effects and sources.</gray>"
        usage: "<yellow>Usage: /land manage</yellow>"
      bypass:
        short: "<gray>Toggle admin bypass.</gray>"
        detail: "<gray>Switches your admin-bypass mode on or off (audited).</gray>"
        usage: "<yellow>Usage: /land bypass [on|off]</yellow>"
      admin:
        short: "<gray>Administration tools.</gray>"
        detail: "<gray>Ledger and orphan-world administration for server operators.</gray>"
        usage: "<yellow>Usage: /land admin (ledger|orphan) ...</yellow>"
    admin:
      ledger:
        usage: "<yellow>Usage: /land admin ledger list [state] | show [operation] | resolve [operation] [RESOLVED|REFUNDED|IGNORED]</yellow>"
        empty: "<gray>No ledger entries match.</gray>"
        line: "<gray><value></gray>"
        resolved: "<green>Ledger operation resolved: <value>.</green>"
        failed: "<red>Ledger admin failed: <reason>.</red>"
      orphan:
        usage: "<yellow>Usage: /land admin orphan list | purge [world-uuid] | purge [world-uuid] confirm [nonce]</yellow>"
        empty: "<gray>No orphan worlds.</gray>"
        line: "<gray><value></gray>"
        confirm: "<yellow>Orphan world <world> holds <count> land(s). Run /land admin orphan purge <world> confirm <nonce> within <expiry>s to delete them permanently. This cannot be undone and never refunds.</yellow>"
        purged: "<green>Orphan world <world> purged: <count> land(s) deleted with no refund.</green>"
        failed: "<red>Orphan admin failed: <reason>.</red>"
