gui:
  manage:
    root:
      title: "<white>Land Management</white>"
      entry_name: "<white>Open the permission detail view.</white>"
      entry_hint: "<gray>Open the permission detail view.</gray>"
    details:
      title: "<white>Land Permissions (<deny_count> DENY, <allow_count> ALLOW)</white>"
      back_name: "<white>Back</white>"
    row:
      head: "<white><action>: <outcome> @ <layer><conflict></white>"
      conflict_suffix: " !CONFLICT"
      remedy_line: "<gray>  - <remedy></gray>"
      default_lore: "<gray>Land default <action>: <state></gray>"
      default_unset: "Unset (inherits global)"
      readonly_line: "<gray>View only in this menu.</gray>"
    remedy:
      unavailable: |-
        <red>Outcome unavailable: data missing or the resolver failed (fail-closed).</red>
        <gray>Re-open the view after the snapshot reloads.</gray>
        <gray>Mutations stay gated; no change was applied.</gray>
      conflict: |-
        <gray>Remove the DENY binding on <layer> through the existing binding flow (still gated).</gray>
        <gray>Keep the DENY and remove the conflicting ALLOW on <layer> instead.</gray>
        <gray>Move the intended ALLOW to a higher-precedence layer: SubLand binding ahead of Land binding, binding ahead of default.</gray>
      plain: |-
        <gray>No conflict: <layer> decides <outcome>.</gray>
        <gray>To change it, update <layer> through the existing management flows (still gated).</gray>
        <gray>Leave defaults INHERIT to inherit; missing values deny fail-closed.</gray>
    unavailable:
      title: "<white>Land Management (unavailable)</white>"
    confirm:
      title: "<white>Confirm permission change: <action></white>"
      confirm_name: "<green>Confirm</green>"
      cancel_name: "<red>Cancel</red>"
      back_name: "<white>Back</white>"
      target_line: "<gray>Target default: <state></gray>"
      failed_line: "<red>Change not applied (fail-closed). No state was modified.</red>"
