      usage: "<yellow>用法：/land trust <player></yellow>"
      success: "<green>已在此領地信任 <player>。</green>"
      failed: "<red>信任失敗：<reason>。</red>"
    untrust:
      console: "<red>只有玩家可以取消信任。</red>"
      usage: "<yellow>用法：/land untrust <player></yellow>"
      success: "<green>已將 <player> 移出此領地。</green>"
      failed: "<red>取消信任失敗：<reason>。</red>"
