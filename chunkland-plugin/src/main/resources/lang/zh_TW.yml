      console: "<red>只有玩家可以變更領地預設。</red>"
      usage: "<yellow>用法：/land default <action> [ALLOW|DENY|INHERIT]</yellow>"
      success: "<green>領地預設 <action> 已設為 <state>。</green>"
      failed: "<red>領地預設變更失敗：<reason>。</red>"
    ban:
      console: "<red>只有玩家可以封鎖成員。</red>"
      usage: "<yellow>用法：/land ban <player></yellow>"
      success: "<green>已在此領地封鎖 <player>。</green>"
      failed: "<red>封鎖失敗：<reason>。</red>"
    unban:
      console: "<red>只有玩家可以解除封鎖。</red>"
      usage: "<yellow>用法：/land unban <player></yellow>"
      success: "<green>已在此領地解除封鎖 <player>。</green>"
      failed: "<red>解除封鎖失敗：<reason>。</red>"
    claim:
      console: "<red>只有玩家可以圈地。</red>"
      no_selection: "<yellow>目前沒有選取範圍。請先選取區塊，再用名稱執行 /land claim。</yellow>"
      success: "<green>領地 <land_name> 已建立：共 <chunk_count> 個區塊。</green>"
      rejected: "<red>圈地被拒絕：<reason>。</red>"
      failed: "<red>圈地失敗：<reason>。</red>"
      cancelled: "<yellow>已取消圈地確認，未建立領地。</yellow>"
    subland:
      console: "<red>只有玩家可以管理子領地。</red>"
