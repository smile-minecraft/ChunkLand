name: ChunkLand
version: ${version}
main: com.smile.chunkland.ChunkLandPlugin
api-version: '26.1.2'
folia-supported: true
depend: [AceLib]
commands:
  chunkland:
    description: ChunkLand debug commands (M0 message + capability smoke probes)
    usage: /chunkland m0message [locale] | /chunkland m0test [scheduler|gui|form|cancelall]
permissions:
  chunkland.admin.serverland:
    default: op
  chunkland.debug.m0message:
    default: op
  chunkland.debug.m0test:
    default: op