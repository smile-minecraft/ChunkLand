name: ChunkLand
version: ${version}
main: com.smile.chunkland.ChunkLandPlugin
api-version: '26.1.2'
folia-supported: true
depend: [AceLib]
commands:
  chunkland:
    description: ChunkLand debug commands (M0 message + capability smoke probes, selection visualization)
    usage: /chunkland m0message [locale] | /chunkland m0test [scheduler|gui|form|cancelall] | /chunkland viz <start|stop|status>
  land:
    description: ChunkLand land management commands
    usage: /land <help|confirm|wand|claim|trust|untrust|default|binding|ban|unban|subland|expand|shrink|unclaim|rename|delete|group|profile>
permissions:
  chunkland.admin.serverland:
    default: op
  chunkland.debug.m0message:
    default: op
  chunkland.debug.m0test:
    default: op
  chunkland.debug.visualization:
    default: op
  chunkland.command.land.help:
    default: op
  chunkland.command.land.confirm:
    default: op
  chunkland.command.land.wand:
    default: op
  chunkland.command.land.claim:
    default: op
  chunkland.command.land.trust:
    default: op
  chunkland.command.land.untrust:
    default: op
  chunkland.command.land.default:
    default: op
  chunkland.command.land.ban:
    default: op
  chunkland.command.land.unban:
    default: op
  chunkland.command.land.subland:
    default: op
  chunkland.command.land.expand:
    default: op
  chunkland.command.land.shrink:
    default: op
  chunkland.command.land.rename:
    default: op
  chunkland.command.land.delete:
    default: op
  chunkland.command.land.group:
    default: op
  chunkland.command.land.profile:
    default: op
  chunkland.command.land.binding:
    default: op
